<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeux Pierre Feuille Ciseau</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Jeux Pierre Feuille Ciseau</h1>
    </header>
    <main>
        <section id="gauche">
            <h2 id="nom">Tente ta chance</h2>
            <div id="btn">
                <button class="tenter" id="Pierre">Pierre</button>
                <button class="tenter" id="Feuille">Feuille</button>
                <button class="tenter" id="Ciseau">Ciseau</button>
            </div>
            <div id="reponse">
                <p id="moi">Votre choix : </p>
                <p id="cpl">Compteur : 3</p>
                <p id="ca">Choix adversaire : </p>
                <p id="verdict">Verdict : </p>
            </div>
        </section>
        <section id="droit">
            <button id="rejouer">Rejouer</button>
            <table>
                <tbody>
                    <tr>
                        <th></th>
                        <th>Moi</th>
                        <th>Adversaire</th>
                    </tr>
                </tbody>
                <tfoot>
                    <th colspan="3">Joue sur 3 manche</th>
                </tfoot>
                <tbody>
                    <tr>
                        <td>Score</td>
                        <td id="me">0</td>      
                        <td id="he">0</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
